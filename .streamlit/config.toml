[theme]
primaryColor = "#667eea"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = true
headless = true
address = "0.0.0.0"
port = 5000

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
